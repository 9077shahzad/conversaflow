name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway credentials for the service containers above. Not secrets.
      DATABASE_URL: postgres://cf_owner:ci-owner-pw@localhost:5432/conversaflow
      DATABASE_APP_URL: postgres://cf_app:ci-app-password@localhost:5432/conversaflow
      CF_APP_DB_PASSWORD: ci-app-password
      DATABASE_IDENTITY_URL: postgres://cf_identity:ci-identity-password@localhost:5432/conversaflow
      CF_IDENTITY_DB_PASSWORD: ci-identity-password
      DATABASE_NOTIFY_URL: postgres://cf_notify:ci-notify-password@localhost:5432/conversaflow
      CF_NOTIFY_DB_PASSWORD: ci-notify-password
      DATABASE_PLATFORM_URL: postgres://cf_platform:ci-platform-password@localhost:5432/conversaflow
      CF_PLATFORM_DB_PASSWORD: ci-platform-password
      SCANNER: clamd
      # CI loads only the test signature; production refuses this setting (official signatures required).
      SCANNER_REQUIRE_OFFICIAL_SIGNATURES: 'false'
      CLAMD_HOST: 127.0.0.1
      CLAMD_PORT: '3310'
      REDIS_URL: redis://localhost:6379
      FILE_STORAGE_DIR: ${{ runner.temp }}/storage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan of full history (gitleaks, open-source CLI; no licence or account needed)
        uses: docker://zricethezav/gitleaks:v8.21.2
        with:
          args: detect --source . --redact --verbose
      - run: pnpm secrets:scan
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: Dependency audit (all packages; fails on high/critical anywhere or any production advisory, unless a recorded exception applies)
        run: pnpm deps:audit
      - name: Unit tests for the audit rules
        run: pnpm test:scripts
      - name: Create the non-superuser owner role
        run: |
          PGPASSWORD=ci-superuser-only psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE cf_owner LOGIN CREATEROLE PASSWORD 'ci-owner-pw'" \
            -c "CREATE DATABASE conversaflow OWNER cf_owner"
      - name: Start ClamAV with the test signature (official signatures are used in hosted environments)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clamav-daemon
          sudo systemctl stop clamav-daemon clamav-freshclam || true
          mkdir -p "$RUNNER_TEMP/clamdb" && cp scripts/clamav/test-signatures.ndb "$RUNNER_TEMP/clamdb/"
          printf 'DatabaseDirectory %s\nTCPSocket 3310\nTCPAddr 127.0.0.1\nForeground no\nUser root\nStreamMaxLength 20M\n' "$RUNNER_TEMP/clamdb" > "$RUNNER_TEMP/clamd.conf"
          sudo TZ=UTC clamd --config-file="$RUNNER_TEMP/clamd.conf"
      - name: Generate per-run keys
        run: |
          echo "FILE_URL_SIGNING_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Migrations, isolation check and tests
        run: pnpm test
      - name: Record the database roles the tests used (restricted, non-owner)
        run: |
          for v in DATABASE_APP_URL DATABASE_IDENTITY_URL DATABASE_NOTIFY_URL DATABASE_PLATFORM_URL; do
            psql "${!v}" -Atc "select '$v -> ' || current_user || ', superuser=' || current_setting('is_superuser') || ', bypassrls=' || (select rolbypassrls from pg_roles where rolname = current_user)"
          done
      - name: English/Arabic UI checks (readability, RTL, accessibility) with screenshots
        run: |
          pnpm --filter @conversaflow/web exec playwright install --with-deps chromium
          pnpm --filter @conversaflow/web e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: docs/reports/evidence/ui/
